<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo 360 pendiente | HomeTours360</title>
    <meta name="robots" content="noindex">
    <style>
      :root {
        --ink: #18201d;
        --cream: #fffaf2;
        --green: #173d32;
        --red: #b83f32;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        color: var(--cream);
        background:
          radial-gradient(circle at 22% 30%, rgba(255, 250, 242, 0.18), transparent 28%),
          linear-gradient(120deg, rgba(23, 61, 50, 0.96), rgba(24, 32, 29, 0.98));
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(760px, calc(100% - 32px));
        padding: 34px;
        border: 1px solid rgba(255, 250, 242, 0.24);
        border-radius: 8px;
        background: rgba(255, 250, 242, 0.08);
      }

      span {
        display: inline-block;
        margin-bottom: 22px;
        color: #ffb179;
        font-size: 0.78rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 16px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.1rem, 7vw, 5.2rem);
        line-height: 0.98;
      }

      p {
        max-width: 620px;
        margin: 0 0 26px;
        color: rgba(255, 250, 242, 0.78);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .demo-frame {
        position: relative;
        overflow: hidden;
        min-height: 220px;
        border: 1px solid rgba(255, 250, 242, 0.22);
        border-radius: 8px;
        background:
          linear-gradient(90deg, rgba(255, 250, 242, 0.1), transparent 20%, rgba(255, 250, 242, 0.08) 46%, transparent 72%),
          linear-gradient(135deg, #315c50, #111815);
      }

      .demo-frame::before {
        content: "";
        position: absolute;
        inset: 18%;
        border: 2px solid rgba(255, 250, 242, 0.34);
        border-radius: 50%;
      }

      .demo-frame::after {
        content: "360";
        position: absolute;
        top: 50%;
        left: 50%;
        color: rgba(255, 250, 242, 0.86);
        font-size: clamp(3rem, 12vw, 7rem);
        font-weight: 900;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <main>
      <span>Demo pendiente</span>
      <h1>El primer tour 360 irá aquí.</h1>
      <p>
        Esta ruta ya existe como aplicación independiente para que HomeTours360 pueda
        incrustarla por iframe o abrirla como recorrido completo cuando el material esté listo.
      </p>
      <div class="demo-frame" aria-label="Placeholder visual del tour 360 pendiente"></div>
    </main>
  </body>
</html>
